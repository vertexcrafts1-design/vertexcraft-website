name: Build LUMINA V1 Windows

on:
  push:
    branches: [lumina-v1-client]
    paths:
      - 'lumina-v1/**'
      - '.github/workflows/lumina-v1-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore tests
        run: dotnet restore lumina-v1/tests/Lumina.Core.Tests/Lumina.Core.Tests.csproj

      - name: Test core
        run: dotnet test lumina-v1/tests/Lumina.Core.Tests/Lumina.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore client service tests
        run: dotnet restore lumina-v1/tests/Lumina.Client.Tests/Lumina.Client.Tests.csproj

      - name: Test client services
        run: dotnet test lumina-v1/tests/Lumina.Client.Tests/Lumina.Client.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend test dependencies
        working-directory: lumina-v1/backend
        run: npm install

      - name: Test LUMINA collection backend
        working-directory: lumina-v1/backend
        run: npm test

      - name: Typecheck LUMINA collection backend
        working-directory: lumina-v1/backend
        run: npm run typecheck

      - name: Restore client
        run: dotnet restore lumina-v1/src/Lumina.Client/Lumina.Client.csproj -r win-x64

      - name: Build client
        run: dotnet build lumina-v1/src/Lumina.Client/Lumina.Client.csproj -c Release -r win-x64 --no-restore

      - name: Restore launch smoke test
        run: dotnet restore lumina-v1/tools/Lumina.LaunchSmoke/Lumina.LaunchSmoke.csproj

      - name: Verify Minecraft + Mojang Java pipeline
        run: dotnet run --project lumina-v1/tools/Lumina.LaunchSmoke/Lumina.LaunchSmoke.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish lumina-v1/src/Lumina.Client/Lumina.Client.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o lumina-v1/publish

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'lumina-v1/publish/LUMINA.exe' -Algorithm SHA256).Hash
          "SHA256  LUMINA.exe  $hash" | Out-File -Encoding utf8 'lumina-v1/publish/SHA256.txt'
          Get-Item 'lumina-v1/publish/LUMINA.exe' | Format-List Name,Length,LastWriteTime
          Get-Content 'lumina-v1/publish/SHA256.txt'

      - name: Upload LUMINA V1
        uses: actions/upload-artifact@v4
        with:
          name: LUMINA-V1-Windows-x64
          path: |
            lumina-v1/publish/LUMINA.exe
            lumina-v1/publish/SHA256.txt
          if-no-files-found: error
          retention-days: 90
